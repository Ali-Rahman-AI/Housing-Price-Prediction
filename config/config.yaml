# Project Configuration
project:
  name: "housing-price-prediction"
  version: "1.0.0"
  random_state: 42

paths:
  raw_data: "data/raw/housing.csv"
  processed_data: "data/processed/housing_clean.csv"
  model_dir: "models/"
  reports_dir: "reports/figures/"

# Data validation rules
data:
  expected_columns:
    - square_feet
    - bedrooms
    - bathrooms
    - age
    - location
    - price

  column_types:
    square_feet: int
    bedrooms: int
    bathrooms: float
    age: float
    location: str
    price: float

  missing_threshold: 0.05  # Flag if >5% missing

  valid_ranges:
    square_feet: [500, 5000]
    bedrooms: [1, 10]
    bathrooms: [0.5, 6.0]
    age: [0, 200]
    price: [50000, 2000000]

  categorical_values:
    location: ["Downtown", "Suburbs", "Rural"]

# Feature engineering
features:
  target: "price"
  numeric_features:
    - square_feet
    - bedrooms
    - bathrooms
    - age

  engineered_features:
    - sqft_per_room
    - total_rooms
    - bed_bath_ratio
    - is_new

  categorical_features:
    - location

  drop_features: []

# Modeling
model:
  test_size: 0.2
  cv_folds: 5

  models_to_train:
    - LinearRegression
    - Ridge
    - RandomForest
    - GradientBoosting

  hyperparameters:
    Ridge:
      alpha: [0.1, 1.0, 10.0]

    RandomForest:
      n_estimators: [100, 200]
      max_depth: [10, 20, None]
      min_samples_split: [2, 5]

    GradientBoosting:
      n_estimators: [100, 200]
      learning_rate: [0.05, 0.1]
      max_depth: [3, 5]
      subsample: [0.8, 1.0]
